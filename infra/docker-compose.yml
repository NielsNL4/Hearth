services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hearth-assets}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  assets:
    build:
      context: ..
      dockerfile: apps/assets/Dockerfile
    depends_on:
      - minio
    environment:
      PORT: 3100
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-hearth-assets}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
      S3_BUCKET: ${S3_BUCKET:-hearth-private-assets}
      S3_FORCE_PATH_STYLE: "true"
      MAP_MAX_PIXELS: ${MAP_MAX_PIXELS:-400000000}
      TOKEN_MAX_PIXELS: ${TOKEN_MAX_PIXELS:-100000000}
      PROCESSING_CONCURRENCY: ${PROCESSING_CONCURRENCY:-2}
      REMOVE_TOKEN_SOURCE: ${REMOVE_TOKEN_SOURCE:-true}
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET:?INTERNAL_JOB_SECRET is required}
      STALE_RESERVATION_MINUTES: ${STALE_RESERVATION_MINUTES:-60}
    ports:
      - "3100:3100"
    restart: unless-stopped

  multiplayer:
    build:
      context: ..
      dockerfile: apps/multiplayer/Dockerfile
    environment:
      PORT: 2567
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      RECONNECTION_SECONDS: ${RECONNECTION_SECONDS:-20}
      PREVIEW_INTERVAL_MS: ${PREVIEW_INTERVAL_MS:-30}
      PREVIEW_EXPIRY_MS: ${PREVIEW_EXPIRY_MS:-2000}
    ports:
      - "2567:2567"
    restart: unless-stopped

volumes:
  minio-data:
